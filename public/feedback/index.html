<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GMA Aviation – Tester-Feedback</title>
<style>
/* Layout: one reading column, language tabs as a sticky strip, sections as plain numbered-free blocks */
:root{
  --bg:#f4f6f8; --paper:#ffffff; --ink:#16202a; --muted:#566370; --line:#d6dde4; --accent:#1b5e8c; --mark:#fff3c4;
  --f-display:"Segoe UI Semibold","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f151b;--paper:#151d25;--ink:#e3e9ef;--muted:#9aa8b5;--line:#2a3743;--accent:#7fb7e2;--mark:#4a3f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151b;--paper:#151d25;--ink:#e3e9ef;--muted:#9aa8b5;--line:#2a3743;--accent:#7fb7e2;--mark:#4a3f12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:44rem;margin:0 auto;padding-block:24px 48px}
header{display:flex;flex-direction:column;gap:6px;padding-block:8px 16px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:600 2rem/1.15 var(--f-display);margin:0;text-wrap:balance}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:20px}
nav a{font:500 13px/1 var(--f-mono);letter-spacing:.06em;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:6px}
nav a[aria-current="true"]{background:var(--paper);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
article{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:4px}
h2{font:600 1.15rem/1.3 var(--f-display);margin:18px 0 2px;color:var(--accent);text-wrap:balance}
h2:first-of-type{margin-top:0}
p,li{margin:0 0 8px;max-width:65ch}
ul{padding-left:1.2em;margin:0}
.todo{background:var(--mark);padding:1px 4px;border-radius:3px}
.meta{font:500 13px/1.4 var(--f-mono);color:var(--muted);margin-top:16px}
a{color:var(--accent)}
[hidden]{display:none!important}

form{display:flex;flex-direction:column;gap:18px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
legend,.q{font:600 1rem/1.35 var(--f-display);padding:0;margin-bottom:4px}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt label{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
input[type=text],input[type=email],textarea{width:100%;font:16px/1.4 var(--f-body);padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:92px;resize:vertical}
.hint{color:var(--muted);font-size:14px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
button{font:600 16px/1 var(--f-body);padding:14px 18px;min-height:48px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#out{margin-top:12px}
.cards{display:flex;flex-direction:column;gap:10px}
.cards a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-decoration:none;font:600 1.05rem/1.3 var(--f-display)}
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow">GMA Aviation Services</span>
    <h1>Tester-Feedback</h1>
  </header>
  <p>Wähle die App, die du getestet hast. · Choose the app you tested.</p>
  <div class="cards">
    <a href="/feedback/hot/">HOT-Rechner · HOT Calculator</a>
    <a href="/feedback/spesen/">Spesen-App · Expenses app</a>
    <a href="/feedback/watchfaces/">Aviator Watch Faces</a>
  </div>
</main>
</body>
</html>
